name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: college_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/college_cms
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      NODE_ENV: test
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Syntax check
        run: node --check server.js && node --check routes/authRoutes.js && node --check routes/userRoutes.js && node --check routes/landingRoutes.js
      - name: Start API and hit health
        run: |
          node server.js &
          sleep 3
          curl -sf http://localhost:5000/api/v1/health | grep -q '"status":"ok"'
          curl -sf http://localhost:5000/docs/ | head -c 200

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.com/api/v1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy notice
        run: |
          echo "CI passed on main."
          echo "Configure your Render (or other) service to auto-deploy from this repository."
          echo "Set root directories: backend for the Web Service, frontend for the Static Site."
          echo "Required secrets on the host: DATABASE_URL, JWT_SECRET, FRONTEND_URL, APP_URL."
          echo "Optional: RESEND_API_KEY, MAIL_FROM, GATEWAY_URL."
