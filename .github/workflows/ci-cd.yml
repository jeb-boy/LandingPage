name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: college_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/college_cms
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      NODE_ENV: test
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run migrate
      - name: Run backend checks
        run: npm test
      - name: Verify OpenAPI YAML parses
        run: node -e "require('yamljs').load('openapi.yaml'); console.log('OpenAPI YAML is valid')"
      - name: Start API and verify health and Swagger
        run: |
          node server.js > /tmp/landing-api.log 2>&1 &
          echo $! > /tmp/landing-api.pid
          for i in {1..20}; do
            if curl -fsS http://localhost:5000/health >/tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://localhost:5000/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:5000/docs/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/v1/not-a-route)" = "404"
          kill "$(cat /tmp/landing-api.pid)"

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api/v1

  deploy-render:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deployments (when hooks are configured)
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ] || [ -z "$RENDER_FRONTEND_DEPLOY_HOOK" ]; then
            echo "Deployment skipped: add RENDER_BACKEND_DEPLOY_HOOK and RENDER_FRONTEND_DEPLOY_HOOK in GitHub repository Actions secrets."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_BACKEND_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$RENDER_FRONTEND_DEPLOY_HOOK"
